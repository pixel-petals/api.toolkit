$kind: http-request
description: Export a dataset in Parquet. Specific parameters are described here
url: "{{baseUrl}}/catalog/datasets/:dataset_id/exports/parquet?parquet_compression=snappy"
method: GET
headers:
  Accept: application/json; charset=utf-8
queryParams:
  - key: parquet_compression
    value: snappy
    description: Sets the compression parameter for the Parquet export file
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "snappy",
            "enum": [
              "snappy",
              "zstd"
            ]
          }
        }
      }
pathVariables:
  - key: dataset_id
    value: string
    description: |-
      The identifier of the dataset to be queried.

      You can find it in the "Information" tab of the dataset page or in the dataset URL, right after `/datasets/`.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
examples: ./.resources/Export a dataset in Parquet.resources/examples
order: 1000
