$kind: http-request
description: |
  Returns a list of all available attachments for a dataset.
url: "{{baseUrl}}/catalog/datasets/:dataset_id/attachments"
method: GET
headers:
  Accept: application/json; charset=utf-8
pathVariables:
  - key: dataset_id
    value: string
    description: |-
      The identifier of the dataset to be queried.

      You can find it in the "Information" tab of the dataset page or in the dataset URL, right after `/datasets/`.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
examples: ./.resources/List dataset attachments.resources/examples
order: 1000
