import:
  typeschema: typehub://typehub:typeschema@0.1.1
definitions:
  Operation:
    description: Describes an API endpoint operation.
    type: struct
    properties:
      method:
        description: The HTTP method associated with this operation (e.g., GET, POST, PUT, DELETE).
        type: string
      path:
        description: The HTTP path associated with this operation. May contain path variables (e.g., /my/path/:year) which map to operation arguments.
        type: string
      return:
        description: The return type of this operation, which defaults to an HTTP status code of 200.
        type: reference
        target: Response
      arguments:
        description: All arguments provided to this operation. Each argument maps to an HTTP request location (e.g., path, query, header, or body).
        type: map
        schema:
          type: reference
          target: Argument
      throws:
        description: All exceptional states that can occur if the operation fails. Each exception is assigned an HTTP error status code.
        type: array
        schema:
          type: reference
          target: Response
      description:
        description: A short description of this operation. Used in generated code docstrings; plain text without line breaks is recommended.
        type: string
      stability:
        description: "Indicates the stability level of this operation: 0 (Deprecated), 1 (Experimental), 2 (Stable), or 3 (Legacy). Defaults to 1 (Experimental)."
        type: integer
      security:
        description: An array of OAuth scopes required to access this specific operation.
        type: array
        schema:
          type: string
      authorization:
        description: Indicates whether this operation requires authorization. If set to false, the client will omit authorization headers. Defaults to true.
        type: boolean
  Argument:
    description: Describes an argument passed to an operation.
    type: struct
    properties:
      in:
        description: "Specifies where the argument value is located: path, query, header, or body. If set to path, the operation path must include a matching path variable."
        type: string
      schema:
        description: TypeSchema describing the structure of the argument payload.
        type: reference
        target: typeschema:PropertyType
      contentType:
        description: The content type to use when the payload cannot be described by a TypeSchema.
        type: string
      name:
        description: Optional name of the parameter in the path, query, or header. If omitted, the key of the arguments map is used.
        type: string
  Response:
    description: Describes an HTTP response returned by an operation.
    type: struct
    properties:
      code:
        description: The HTTP status code associated with this response. Wildcard error status codes like 499, 599, or 999 can be used to catch all errors.
        type: integer
      contentType:
        description: The content type to use when the response body cannot be described by a TypeSchema.
        type: string
      schema:
        description: TypeSchema describing the structure of the response payload.
        type: reference
        target: typeschema:PropertyType
root: Operation
