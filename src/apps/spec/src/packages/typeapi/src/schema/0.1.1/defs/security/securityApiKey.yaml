definitions:
  Security:
    description: Describes the authentication mechanism used by the API.
    type: struct
    base: true
    properties:
      type:
        description: "The global security type of the API. Must be one of: httpBasic, httpBearer, apiKey, or oauth2."
        type: string
    discriminator: type
    mapping:
      SecurityHttpBasic: httpBasic
      SecurityHttpBearer: httpBearer
      SecurityApiKey: apiKey
      SecurityOAuth: oauth2
  SecurityApiKey:
    description: Describes API key authentication passed via a header or query parameter.
    type: struct
    parent:
      type: reference
      target: Security
    properties:
      name:
        description: The name of the header or query parameter (e.g., "X-Api-Key").
        type: string
      in:
        description: The location of the API key. Must be either "header" or "query".
        type: string
root: SecurityApiKey
