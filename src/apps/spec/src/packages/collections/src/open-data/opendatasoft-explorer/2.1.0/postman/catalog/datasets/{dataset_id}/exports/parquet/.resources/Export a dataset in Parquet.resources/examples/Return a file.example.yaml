$kind: http-example
request:
  url: "{{baseUrl}}/catalog/datasets/:dataset_id/exports/parquet?parquet_compression=snappy&apikey=<API Key>"
  method: GET
  queryParams:
    - key: parquet_compression
      value: snappy
      description: Sets the compression parameter for the Parquet export file
    - key: apikey
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    - key: dataset_id
      value: string
      description: |-
        The identifier of the dataset to be queried.

        You can find it in the "Information" tab of the dataset page or in the dataset URL, right after `/datasets/`.
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
