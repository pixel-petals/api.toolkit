$kind: http-example
request:
  url: "{{baseUrl}}/catalog/datasets/:dataset_id/exports/gpx?name_field=string&description_field_list=string&use_extension=true&apikey=<API Key>"
  method: GET
  headers:
    Accept: application/json; charset=utf-8
  queryParams:
    - key: name_field
      value: string
      description: Sets the field that is used as the 'name' attribute in the GPX output
    - key: description_field_list
      value: string
      description: Sets the fields to use in the 'description' attribute of the GPX output
    - key: use_extension
      value: "true"
      description: |-
        Set it to true to use the `<extension>` tag for attributes (as GDAL does). Set it to false to use the `<desc>` tag for attributes.
        **Warning:** the default value of this parameter is `false` in v2.0 and `true` starting with v2.1
    - key: apikey
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    - key: dataset_id
      value: string
      description: |-
        The identifier of the dataset to be queried.

        You can find it in the "Information" tab of the dataset page or in the dataset URL, right after `/datasets/`.
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "errorcode": 10002,
        "reset_time": "2021-01-26T00:00:00Z",
        "limit_time_unit": "day",
        "call_limit": 10000,
        "error": "Too many requests on the domain. Please contact the domain administrator."
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "errorcode": {
            "type": "number"
          },
          "reset_time": {
            "type": "string",
            "minLength": 1
          },
          "limit_time_unit": {
            "type": "string",
            "minLength": 1
          },
          "call_limit": {
            "type": "number"
          },
          "error": {
            "type": "string",
            "minLength": 1
          }
        },
        "required": [
          "errorcode",
          "reset_time",
          "limit_time_unit",
          "call_limit",
          "error"
        ]
      }
order: 4000
