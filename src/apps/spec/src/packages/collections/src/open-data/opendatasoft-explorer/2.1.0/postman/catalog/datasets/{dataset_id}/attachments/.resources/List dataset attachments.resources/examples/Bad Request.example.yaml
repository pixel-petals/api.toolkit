$kind: http-example
request:
  url: "{{baseUrl}}/catalog/datasets/:dataset_id/attachments?apikey=<API Key>"
  method: GET
  headers:
    Accept: application/json; charset=utf-8
  queryParams:
    - key: apikey
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    - key: dataset_id
      value: string
      description: |-
        The identifier of the dataset to be queried.

        You can find it in the "Information" tab of the dataset page or in the dataset URL, right after `/datasets/`.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "ODSQL query is malformed: invalid_function() Clause(s) containing the error(s): select.",
        "error_code": "ODSQLError"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string",
            "minLength": 1
          },
          "error_code": {
            "type": "string",
            "minLength": 1
          }
        },
        "required": [
          "message",
          "error_code"
        ]
      }
order: 2000
