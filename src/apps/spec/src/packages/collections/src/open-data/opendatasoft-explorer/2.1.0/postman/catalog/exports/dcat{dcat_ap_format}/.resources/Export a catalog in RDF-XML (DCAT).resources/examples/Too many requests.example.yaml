$kind: http-example
request:
  url: "{{baseUrl}}/catalog/exports/dcat{{dcat_ap_format}}?include_exports=csv,json,geojson&use_labels_in_exports=true&apikey=<API Key>"
  method: GET
  headers:
    Accept: application/json; charset=utf-8
  queryParams:
    - key: include_exports
      value: csv,json,geojson
      description: Sets the datasets exports exposed in the DCAT export. By default, all exports are exposed.
    - key: use_labels_in_exports
      value: "true"
      description: If set to `true`, this parameter will make distributions output the label of each field rather than its name. This parameter only applies on distributions that contain a list of the fields in their output (e.g., CSV, XLSX).
    - key: apikey
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "errorcode": 10002,
        "reset_time": "2021-01-26T00:00:00Z",
        "limit_time_unit": "day",
        "call_limit": 10000,
        "error": "Too many requests on the domain. Please contact the domain administrator."
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "errorcode": {
            "type": "number"
          },
          "reset_time": {
            "type": "string",
            "minLength": 1
          },
          "limit_time_unit": {
            "type": "string",
            "minLength": 1
          },
          "call_limit": {
            "type": "number"
          },
          "error": {
            "type": "string",
            "minLength": 1
          }
        },
        "required": [
          "errorcode",
          "reset_time",
          "limit_time_unit",
          "call_limit",
          "error"
        ]
      }
order: 4000
